<!DOCTYPE html>
<!-- Template: build.mjs writes this once, as /404.html. GitHub Pages shows it for any address that doesn't exist, so every link starts from the site root. -->
<html lang="{{lang}}" dir="{{dir}}" data-theme="atoa">
<head>
{{>head}}
<meta name="robots" content="noindex">
</head>
<body class="bg-base-100 text-base-content">

<header class="border-b border-base-300">
  <nav class="mx-auto max-w-6xl px-4 sm:px-6 h-16 flex items-center" aria-label="{{nav_label}}">
    <a href="/" dir="ltr" class="logo text-[1.75rem]" aria-label="AtoA">{{logo_mark}}<span>Ato<span class="logo-a">A</span></span></a>
  </nav>
</header>

<main id="main" class="mx-auto max-w-3xl px-4 sm:px-6 py-16 sm:py-24">
  <p class="font-mono text-sm text-secondary">404</p>
  <h1 class="mt-3 text-4xl sm:text-5xl leading-tight text-base-content">{{nf_heading}}</h1>
  <p class="mt-4 text-lg text-base-content/70 leading-relaxed max-w-xl">{{nf_body}}</p>
  <div class="mt-10 grid sm:grid-cols-2 gap-3">
      {{nf_cards}}
  </div>
  <div class="mt-10 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-base-content/70">
    <a href="{{whatsapp}}" target="_blank" rel="noopener" class="btn btn-outline btn-sm border-base-300">{{hero_whatsapp}}</a>
    <span dir="ltr">{{contact_line}}</span>
  </div>
</main>

{{>footer}}

<script>
  document.querySelectorAll("[data-year]").forEach(el => el.textContent = new Date().getFullYear());
</script>
</body>
</html>
